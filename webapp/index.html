<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ADCakeyuan 星图 · Digital Twin Galaxy</title>
    <meta name="description" content="把我的 16 个项目变成一片星系：行星大小=代码量，转速=提交热度，光晕=健康状态。实时遥测。" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌌</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <header id="hud">
      <h1>ADCakeyuan <span>星图</span></h1>
      <p id="hud-meta">正在读取遥测…</p>
    </header>
    <p id="hint">拖拽旋转 · 滚轮缩放 · 点击星球看详情</p>
    <aside id="card" class="hidden">
      <button id="card-close" aria-label="关闭">×</button>
      <h2 id="card-name"></h2>
      <p id="card-desc"></p>
      <dl id="card-stats"></dl>
      <div id="card-links"></div>
      <canvas id="card-spark" width="240" height="36"></canvas>
      <p class="spark-cap">最近探活延迟趋势</p>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
