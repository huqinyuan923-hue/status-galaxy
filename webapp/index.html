<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta property="og:title" content="ADCakeyuan 星图 · Digital Twin Galaxy" />
    <meta property="og:description" content="16 个项目变成一片星系：行星大小=代码量，转速=提交热度，光晕=健康状态，AI 小镇居民是卫星。实时遥测。" />

    <meta property="og:url" content="https://status.adcakeyuan.top/" />
    <meta property="og:image" content="https://status.adcakeyuan.top/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ADCakeyuan 星图" />
    <meta name="twitter:description" content="16 个项目的数字孪生星系，实时遥测" />
    <meta name="twitter:image" content="https://status.adcakeyuan.top/og.png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ADCakeyuan 星图",
      "url": "https://status.adcakeyuan.top/",
      "description": "16 个项目的数字孪生星系：实时探活、GitHub 遥测与 AI 小镇状态可视化",
      "inLanguage": "zh-CN"
    }
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌌</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* 进站动画：星图对齐（每会话一次） */
      #boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(ellipse 80% 55% at 50% 30%,rgba(125,211,252,.1),transparent),#020409;font-family:system-ui,sans-serif;animation:gxOut .6s cubic-bezier(.65,0,.35,1) 2.65s forwards}
      #boot .g-stars{display:flex;gap:22px}
      #boot .g-stars i{width:6px;height:6px;border-radius:50%;background:#7dd3fc;box-shadow:0 0 10px #7dd3fc;opacity:0;animation:gxTwinkle .5s ease both}
      #boot .g-stars i:nth-child(1){animation-delay:.3s}
      #boot .g-stars i:nth-child(2){animation-delay:.5s}
      #boot .g-stars i:nth-child(3){animation-delay:.7s}
      #boot .g-stars i:nth-child(4){animation-delay:.9s}
      #boot .g-stars i:nth-child(5){animation-delay:1.1s}
      #boot .g-logo{color:#e2e8f0;font-size:clamp(24px,5vw,42px);font-weight:800;letter-spacing:.06em;opacity:0;animation:gxIn .5s ease 1.1s both}
      #boot .g-logo em{font-style:normal;background:linear-gradient(90deg,#7dd3fc,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
      #boot .g-bar{width:min(280px,62vw);height:3px;border-radius:999px;overflow:hidden;background:rgba(125,211,252,.14);opacity:0;animation:gxIn .3s ease 1.35s both}
      #boot .g-bar::before{content:'';display:block;height:100%;background:linear-gradient(90deg,#7dd3fc,#a78bfa);transform:scaleX(0);transform-origin:left;animation:gxFill 1.1s cubic-bezier(.3,0,.4,1) 1.45s forwards}
      #boot .g-sub{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.15em;color:#64748b;opacity:0;animation:gxIn .35s ease 1.75s both}
      @keyframes gxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @keyframes gxTwinkle{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
      @keyframes gxFill{to{transform:scaleX(1)}}
      @keyframes gxOut{to{opacity:0;visibility:hidden;transform:scale(1.05)}}
      @media (prefers-reduced-motion:reduce){#boot{display:none}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="g-stars"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="g-logo">星图 <em>GALAXY</em></div>
      <div class="g-bar"></div>
      <div class="g-sub">DIGITAL TWIN · REALTIME</div>
    </div>
    <script>try{if(sessionStorage.getItem('boot-seen')){var b=document.getElementById('boot');b&&(b.style.display='none')}else{sessionStorage.setItem('boot-seen','1')}}catch(e){}</script>
    <div id="app"></div>
    <header id="hud">
      <h1>ADCakeyuan <span>星图</span></h1>
      <p id="hud-meta">正在读取遥测…</p>
    </header>
    <p id="hint">拖拽旋转 · 滚轮缩放 · 点击星球看详情</p>
    <div id="tooltip" class="hidden"></div>
    <aside id="card" class="hidden">
      <button id="card-close" aria-label="关闭">×</button>
      <h2 id="card-name"></h2>
      <p id="card-desc"></p>
      <dl id="card-stats"></dl>
      <div id="card-links"></div>
      <canvas id="card-spark" width="240" height="36"></canvas>
      <p class="spark-cap">最近探活延迟趋势</p>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
